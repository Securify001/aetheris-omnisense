[package]
name = "aetheris_agent_contract"
version = "0.1.0"
authors = ["Aetheris OmniSense Team <dev@aetheris.ai>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.5.0", features = ["legacy", "unit-testing"] }
borsh = "1.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
